<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">
    <title>TAA W&B REV 224</title>
    <style>
        :root { --airasia-red: #e11b22; --bg: #f4f7f6; }
        body { font-family: -apple-system, sans-serif; margin: 0; background: var(--bg); padding-bottom: 30px; }
        .header { background: var(--airasia-red); color: white; padding: 15px; text-align: center; font-weight: bold; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .container { padding: 12px; max-width: 500px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; }
        label { display: block; font-size: 0.75rem; font-weight: bold; margin-bottom: 5px; color: #666; text-transform: uppercase; }
        select, input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; box-sizing: border-box; outline: none; }
        select:focus, input:focus { border-color: var(--airasia-red); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .res-box { padding: 12px; border-radius: 8px; background: #fff; border: 1px solid #eee; border-left: 6px solid #ccc; margin-bottom: 10px; transition: 0.3s; }
        .res-label { font-size: 0.7rem; color: #888; display: block; font-weight: bold; }
        .res-val { font-size: 1.3rem; font-weight: bold; display: block; margin: 4px 0; }
        .limit-text { font-size: 0.75rem; color: #999; }
        .ok { border-left-color: #28a745; }
        .over { border-left-color: #dc3545; background: #fff5f5; color: #dc3545; }
        .hint { font-size: 0.7rem; color: #999; margin-top: -8px; margin-bottom: 10px; font-style: italic; }
    </style>
</head>
<body>

<div class="header">TAA W&B SUMMARY REV 224</div>

<div class="container">
    <div class="card">
        <label>Aircraft Registration</label>
        <select id="reg" onchange="updateCrewOptions()"><option value="">-- Select --</option></select>
        <label>Crew Configuration</label>
        <select id="crew" onchange="calculate()"><option value="">-- Select --</option></select>
    </div>

    <div class="card">
        <label>Pilot Weight Adjustment (Total KG)</label>
        <input type="number" id="pilotWeight" placeholder="e.g. 175" oninput="calculate()">
        <p class="hint">*Standard weights (85kg/pilot) are already in DOW.</p>
        <div class="grid">
            <div><label>Pax Count</label><input type="number" id="pax" value="0" oninput="calculate()"></div>
            <div><label>Cargo (KG)</label><input type="number" id="cargo" value="0" oninput="calculate()"></div>
        </div>
        <div class="grid">
            <div><label>T/O Fuel</label><input type="number" id="fuel" value="0" oninput="calculate()"></div>
            <div><label>Trip Fuel</label><input type="number" id="tripFuel" value="0" oninput="calculate()"></div>
        </div>
    </div>

    <div id="results">
        <div class="res-box" id="box-zfw"><span class="res-label">ZERO FUEL WEIGHT</span><span class="res-val" id="zfw">0 KG</span><span id="lim-zfw" class="limit-text">Limit: -</span></div>
        <div class="res-box" id="box-tow"><span class="res-label">TAKEOFF WEIGHT</span><span class="res-val" id="tow">0 KG</span><span id="lim-tow" class="limit-text">Limit: -</span></div>
        <div class="res-box" id="box-lw"><span class="res-label">LANDING WEIGHT</span><span class="res-val" id="lw">0 KG</span><span id="lim-lw" class="limit-text">Limit: -</span></div>
    </div>
</div>

const regSelect = document.getElementById('reg');
const crewSelect = document.getElementById('crew');

Object.keys(fleetData).sort().forEach(r => {
    let o = document.createElement('option'); o.value = r; o.innerText = r; regSelect.appendChild(o);
});

function updateCrewOptions() {
    const r = regSelect.value;
    crewSelect.innerHTML = '<option value="">-- Select Config --</option>';
    if(!r) return;
    Object.keys(fleetData[r].weights).forEach(c => {
        let o = document.createElement('option'); o.value = c; o.innerText = "Crew " + c; crewSelect.appendChild(o);
    });
    calculate();
}

function calculate() {
    const r = regSelect.value;
    const c = crewSelect.value;
    if(!r || !c) return;

    const ac = fleetData[r];
    const dow = ac.weights[c];
    const pilotAdj = parseFloat(document.getElementById('pilotWeight').value) || 0;
    const paxWeight = (parseFloat(document.getElementById('pax').value) || 0) * 84;
    const cargo = parseFloat(document.getElementById('cargo').value) || 0;
    const fuel = parseFloat(document.getElementById('fuel').value) || 0;
    const trip = parseFloat(document.getElementById('tripFuel').value) || 0;

    const zfw = dow + pilotAdj + paxWeight + cargo;
    const tow = zfw + fuel;
    const lw = tow - trip;

    updateUI('zfw', zfw, ac.mzfw);
    updateUI('tow', tow, ac.mtow);
    updateUI('lw', lw, ac.mlw);
}

function updateUI(id, val, limit) {
    const b = document.getElementById('box-' + id);
    document.getElementById(id).innerText = Math.round(val).toLocaleString() + " KG";
    document.getElementById('lim-' + id).innerText = "Limit: " + limit.toLocaleString() + " KG";
    b.className = val > limit ? "res-box over" : "res-box ok";
}

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => console.log('SW Active'));
