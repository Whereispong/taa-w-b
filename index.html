<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAA W&B REV 224 FINAL</title>
    <style>
        :root { --airasia-red: #e11b22; --bg: #f4f7f6; }
        body { font-family: -apple-system, sans-serif; margin: 0; background: var(--bg); padding-bottom: 30px; }
        .header { background: var(--airasia-red); color: white; padding: 15px; text-align: center; font-weight: bold; position: sticky; top: 0; z-index: 100; }
        .container { padding: 12px; max-width: 500px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; }
        label { display: block; font-size: 0.75rem; font-weight: bold; margin-bottom: 5px; color: #666; text-transform: uppercase; }
        select, input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; box-sizing: border-box; outline: none; }
        input[readonly] { background-color: #f0f0f0; color: #555; cursor: not-allowed; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .type-toggle { display: flex; gap: 5px; margin-bottom: 15px; }
        .type-btn { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px; background: #eee; cursor: pointer; text-align: center; font-weight: bold; font-size: 0.8rem; }
        .type-btn.active { background: var(--airasia-red); color: white; border-color: var(--airasia-red); }
        .res-box { padding: 12px; border-radius: 8px; background: #fff; border: 1px solid #eee; border-left: 6px solid #ccc; margin-bottom: 10px; }
        .res-label { font-size: 0.7rem; color: #888; display: block; font-weight: bold; }
        .res-val { font-size: 1.3rem; font-weight: bold; display: block; margin: 4px 0; }
        .pax-detail { font-size: 0.85rem; color: #444; margin-top: -5px; margin-bottom: 10px; background: #f9f9f9; padding: 8px; border-radius: 5px; }
        .ok { border-left-color: #28a745; }
        .over { border-left-color: #dc3545; background: #fff5f5; color: #dc3545; }
    </style>
</head>
<body>

<div class="header">TAA W&B SUMMARY REV 224</div>

<div class="container">
    <div class="card">
        <label>Aircraft Registration</label>
        <select id="reg" onchange="updateCrewOptions()"><option value="">-- Select --</option></select>
        <label>Crew Configuration</label>
        <select id="crew" onchange="calculate()"><option value="">-- Select --</option></select>
    </div>

    <div class="card">
        <label>Flight Type</label>
        <div class="type-toggle">
            <div id="btn-dom" class="type-btn active" onclick="setType('DOM')">DOMESTIC</div>
            <div id="btn-int" class="type-btn" onclick="setType('INT')">INTERNATIONAL</div>
        </div>

        <label>Pax (Adult/Child/Infant)</label>
        <input type="text" id="paxInput" placeholder="e.g. 168/10/2" oninput="calculate()">
        <div id="paxDisplay" class="pax-detail">A: 0 | C: 0 | I: 0 = 0 KG</div>

        <div class="grid">
            <div><label>Cargo (KG)</label><input type="number" id="cargo" value="0" oninput="calculate()"></div>
            <div><label>Pilot Adj (KG)</label><input type="number" id="pilotWeight" value="0" oninput="calculate()"></div>
        </div>
        
        <hr style="border: 0; border-top: 1px dashed #ddd; margin: 10px 0;">
        
        <div class="grid">
            <div><label>Block Fuel</label><input type="number" id="blockFuel" value="0" oninput="calculate()"></div>
            <div><label>Taxi Fuel</label><input type="number" id="taxiFuel" value="200" oninput="calculate()"></div>
        </div>
        <div class="grid">
            <div><label>T/O Fuel (Auto)</label><input type="number" id="fuel" value="0" readonly></div>
            <div><label>Trip Fuel</label><input type="number" id="tripFuel" value="0" oninput="calculate()"></div>
        </div>
    </div>

    <div id="results">
        <div class="res-box" id="box-zfw"><span class="res-label">ZERO FUEL WEIGHT</span><span class="res-val" id="zfw">0 KG</span><span id="lim-zfw"></span></div>
        <div class="res-box" id="box-tow"><span class="res-label">TAKEOFF WEIGHT</span><span class="res-val" id="tow">0 KG</span><span id="lim-tow"></span></div>
        <div class="res-box" id="box-lw"><span class="res-label">LANDING WEIGHT</span><span class="res-val" id="lw">0 KG</span><span id="lim-lw"></span></div>
    </div>
</div>

function setType(t) {
    flightType = t;
    document.getElementById('btn-dom').className = t === 'DOM' ? 'type-btn active' : 'type-btn';
    document.getElementById('btn-int').className = t === 'INT' ? 'type-btn active' : 'type-btn';
    calculate();
}

const regSelect = document.getElementById('reg');
Object.keys(fleetData).sort().forEach(r => {
    let o = document.createElement('option'); o.value = r; o.innerText = r; regSelect.appendChild(o);
});

function updateCrewOptions() {
    const r = regSelect.value;
    const crewSelect = document.getElementById('crew');
    crewSelect.innerHTML = '<option value="">-- Select --</option>';
    if(!r) return;
    Object.keys(fleetData[r].weights).forEach(c => {
        let o = document.createElement('option'); o.value = c; o.innerText = "Crew " + c; crewSelect.appendChild(o);
    });
}

function calculate() {
    const r = regSelect.value;
    const c = document.getElementById('crew').value;
    if(!r || !c) return;

    const ac = fleetData[r];
    const dow = ac.weights[c];
    
    // Pax Logic
    const paxStr = document.getElementById('paxInput').value || "0/0/0";
    const parts = paxStr.split('/').map(v => parseInt(v) || 0);
    const adultCount = parts[0] || 0;
    const childCount = parts[1] || 0;
    const infantCount = parts[2] || 0;
    const adultWt = (flightType === 'INT') ? 74 : 72;
    const paxTotalWt = (adultCount * adultWt) + (childCount * 40) + (infantCount * 10);
    document.getElementById('paxDisplay').innerText = `A: ${adultCount}x${adultWt} | C: ${childCount}x40 | I: ${infantCount}x10 = ${paxTotalWt.toLocaleString()} KG`;

    // Fuel Logic
    const block = parseFloat(document.getElementById('blockFuel').value) || 0;
    const taxi = parseFloat(document.getElementById('taxiFuel').value) || 0;
    const takeoffFuel = block - taxi;
    document.getElementById('fuel').value = takeoffFuel; // Display the calculated T/O fuel

    const cargo = parseFloat(document.getElementById('cargo').value) || 0;
    const pilotAdj = parseFloat(document.getElementById('pilotWeight').value) || 0;
    const trip = parseFloat(document.getElementById('tripFuel').value) || 0;

    const zfw = dow + pilotAdj + paxTotalWt + cargo;
    const tow = zfw + takeoffFuel;
    const lw = tow - trip;

    updateUI('zfw', zfw, ac.mzfw);
    updateUI('tow', tow, ac.mtow);
    updateUI('lw', lw, ac.mlw);
}

function updateUI(id, val, limit) {
    const b = document.getElementById('box-' + id);
    document.getElementById(id).innerText = Math.round(val).toLocaleString() + " KG";
    document.getElementById('lim-' + id).innerText = "Limit: " + limit.toLocaleString() + " KG";
    b.className = val > limit ? "res-box over" : "res-box ok";
}
